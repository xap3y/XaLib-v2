plugins {
    id 'com.gradleup.shadow' version '9.2.2'
    id 'io.freefair.lombok' version '8.7.1'
    id "net.kyori.blossom" version "1.3.1"
    id 'java'
}

group = 'eu.xap3y'

def gitHash = {
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-parse', '--short', 'HEAD'
            standardOutput = stdout
        }
        return stdout.toString().trim()
    } catch (Exception ignored) {
        return "unknown"
    }
}

blossom {
    replaceToken("@VERSION@", version)
    replaceToken("@GIT_HASH@", gitHash())
}

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }

    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }

    maven {
        url = "https://jitpack.io"
    }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:${paperVersion ?: '1.21.10'}-R0.1-SNAPSHOT"
    implementation "org.incendo:cloud-annotations:${cloudAnnotationsVersion ?: '2.1.0'}"
    implementation "org.incendo:cloud-paper:${cloudPaperVersion ?: '2.0.1'}"
    implementation "org.bstats:bstats-bukkit:${bStatsVersion ?: '3.2.1'}"
    implementation "com.google.code.gson:gson:${gsonVersion ?: '2.13.2'}"
    implementation "eu.xap3y:xagui:${xaGuiVersion ?: '1.5.1'}"
    implementation "eu.xap3y:xagui-paper:${xaGuiVersion ?: '1.5.1'}"
    implementation "com.zaxxer:HikariCP:${hikariCPVersion ?: '7.2.0'}"
    implementation "org.mariadb.jdbc:mariadb-java-client:${mariaDbVersion ?: '3.5.7'}"
    implementation "io.projectreactor:reactor-core:${reactorCoreVersion ?: '3.8.3'}"
    implementation "fr.mrmicky:fastboard:${fastBoardVersion ?: '2.1.5'}"
    implementation "com.github.cryptomorin:XSeries:${xSeriesVersion ?: '13.6.0'}"
    implementation "com.github.fierioziy.particlenativeapi:ParticleNativeAPI-core:${particleApiVersion ?: '4.5.1'}"
    implementation "com.bucket4j:bucket4j_jdk17-core:${bucket4jVersion ?: '8.18.0'}"
    testImplementation "io.papermc.paper:paper-api:${paperVersion ?: '1.21.10'}-R0.1-SNAPSHOT"
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
}

test {
    useJUnitPlatform()
}

sourceSets {
    agent {
        java.srcDir 'src/agent/java'
    }
}

def agentJar = tasks.register('agentJar', Jar) {
    archiveBaseName.set(baseCoordinates)
    archiveClassifier.set('agent')
    from sourceSets.agent.output
    manifest {
        attributes(
                'Premain-Class': 'eu.xap3y.xalib.agent.XaLibAgent',
                'Agent-Class': 'eu.xap3y.xalib.agent.XaLibAgent',
                'Can-Redefine-Classes': 'true',
                'Can-Retransform-Classes': 'true'
        )
    }
}

tasks.named('test') {
    dependsOn agentJar
    systemProperty 'xalib.agentJar', agentJar.flatMap { it.archiveFile }.get().asFile.absolutePath
    systemProperty 'xalib.testClasspath', sourceSets.test.runtimeClasspath.asPath
    systemProperty 'xalib.mainClasses', sourceSets.main.output.classesDirs.asPath
}

def targetJavaVersion = javaVersion.replaceAll("\"", "").toInteger() ?: 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [
            version: version,
            baseCoordinates: baseCoordinates,
            mainClass: "${project.group}.${baseCoordinates.toLowerCase()}.${baseCoordinates}"
    ]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

build {
    dependsOn(shadowJar, agentJar)
}

tasks.jar {
    enabled = false
}

tasks {
    shadowJar {
        archiveClassifier.set('')
        archiveBaseName.set(baseCoordinates)

        mergeServiceFiles()
        dependencies {
            exclude(dependency('io.papermc.paper:paper-api'))
        }

        relocate("org.bstats", project.group.toString())

        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
        exclude '**/module-info.class'
        exclude '**/*.kotlin_metadata', '**/*.kotlin_builtins'
        exclude 'META-INF/*.kotlin_module', 'META-INF/*.version', 'META-INF/versions/**'
        exclude '**/package-info.class'
        exclude 'META-INF/signatures/**'
        exclude '**/*Test*', '**/test/**', '**/tests/**', '**/*Example*', '**/samples/**', '**/javadoc/**'
        exclude '**/i18n/**', '**/locale/**', '**/locales/**', '**/messages/**'
    }
}
